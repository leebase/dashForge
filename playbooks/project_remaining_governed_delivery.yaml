{
  "playbook_id": "project_remaining_governed_delivery",
  "name": "DashForge remaining project governed delivery",
  "defaults": {
    "worker": "codex_cli",
    "retry_policy": {
      "max_attempts": 2,
      "strategy": "rerun_with_validation_feedback"
    }
  },
  "run_policy": {
    "on_step_failure": "halt",
    "require_validation_pass_to_advance": true
  },
  "steps": [
    {
      "step_id": "step_01_define_remaining_project_contract",
      "name": "Define the remaining project contract",
      "mission": "Read AGENTS.md, context.md, sprint-plan.md, project-plan.md, product-definition.md, and architecture.md. Write docs/project-remaining-contract.md so it captures the full remaining documented project scope after Sprint 1 and the dependency order for one governed long-running delivery.",
      "inputs": [
        "AGENTS.md",
        "context.md",
        "sprint-plan.md",
        "project-plan.md",
        "product-definition.md",
        "architecture.md"
      ],
      "allowed_paths": [
        "docs/"
      ],
      "depends_on": [],
      "outputs": {
        "required": [
          {
            "path": "docs/project-remaining-contract.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "docs/project-remaining-contract.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "docs/project-remaining-contract.md",
            "headings": [
              "Overview",
              "Remaining Objectives Inventory",
              "In Scope",
              "Out of Scope",
              "Required Outputs",
              "Acceptance Checks",
              "Constraints",
              "Dependency Order"
            ]
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the contract so it reflects the full remaining documented project work and not just broad umbrella phases.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_02_plan_remaining_project_delivery",
      "name": "Plan the remaining project delivery",
      "mission": "Read the remaining-project contract and the canon docs. Write plans/project-remaining-delivery-plan.md with the architecture, scope layers, data/runtime workflow strategy, verification approach, risks, and open questions for the remaining project.",
      "inputs": [
        "AGENTS.md",
        "docs/project-remaining-contract.md",
        "project-plan.md",
        "product-definition.md",
        "architecture.md",
        "frontend/package.json"
      ],
      "allowed_paths": [
        "plans/"
      ],
      "depends_on": [
        "step_01_define_remaining_project_contract"
      ],
      "outputs": {
        "required": [
          {
            "path": "plans/project-remaining-delivery-plan.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "plans/project-remaining-delivery-plan.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "plans/project-remaining-delivery-plan.md",
            "headings": [
              "Architecture",
              "Scope Layers",
              "Data Strategy",
              "Runtime Strategy",
              "Workflow Strategy",
              "Verification",
              "Risks",
              "Open Questions"
            ]
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the plan so it decomposes the remaining project into clear, operator-visible layers.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_03_finish_spec_and_runtime_prerequisites",
      "name": "Finish spec and runtime prerequisites",
      "mission": "Read AGENTS.md, the remaining-project contract and plan, product-definition.md, and architecture.md. Implement the remaining spec/runtime prerequisites in frontend/: broaden DashboardSpec and validation coverage, add spec save/load scaffolding, complete theme definitions, and add the browser-side SQLite/sql.js adapter scaffold described in the architecture.",
      "inputs": [
        "AGENTS.md",
        "docs/project-remaining-contract.md",
        "plans/project-remaining-delivery-plan.md",
        "product-definition.md",
        "architecture.md",
        "frontend/package.json"
      ],
      "allowed_paths": [
        "frontend/"
      ],
      "depends_on": [
        "step_02_plan_remaining_project_delivery"
      ],
      "outputs": {
        "required": [
          {
            "path": "frontend/src/core/spec/dashboardSpec.ts",
            "type": "text"
          },
          {
            "path": "frontend/src/core/spec/dashboardSchema.ts",
            "type": "text"
          },
          {
            "path": "frontend/src/core/data/SQLiteDataAdapter.ts",
            "type": "text"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "frontend/src/core/data/SQLiteDataAdapter.ts"
          }
