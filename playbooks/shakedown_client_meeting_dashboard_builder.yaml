        "frontend/dist/index.html",
        "tests/browser_smoke_manifest.json",
        "artifacts/current/client-meeting-dashboard-builder-input-validation.json"
      ],
      "allowed_paths": [
        "artifacts/user-smoke/"
      ],
      "depends_on": [
        "validate_verified_work_package"
      ],
      "outputs": {
        "required": [
          {
            "path": "artifacts/user-smoke/result.json",
            "type": "json"
          },
          {
            "path": "artifacts/user-smoke/page-source.html",
            "type": "html"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "json_parse",
            "path": "artifacts/user-smoke/result.json"
          },
          {
            "type": "file_exists",
            "path": "artifacts/user-smoke/page-source.html"
          },
          {
            "type": "file_hash_matches",
            "path": "tests/browser_smoke_manifest.json",
            "sha256": "b55d40c82035d15167de3665540202db9ee5d10f1ef76cc416b95fdbdec797c6"
          }
        ]
      },
      "on_fail": {
        "retry_message": "Re-run the real standalone browser path. Do not claim readiness unless the controlled quality disclosure is visible and the export interaction succeeds.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "materialize_meeting_dashboard_package",
      "name": "Materialize deterministic meeting dashboard package parts",
      "mission": "Prepare, but do not perform, the deterministic packaging publication. The platform system validator executes the frontend package:meeting-dashboard export seam exactly once after your attempt, and the publisher refuses a non-empty output directory, so you must NOT run the packaging command and must leave artifacts/current/client-meeting-dashboard-builder/ ABSENT: if the directory exists and is empty, remove it with rmdir (the publisher's atomic rename recreates it; an existing directory makes the publisher's final swap fail). Your job: verify artifacts/current/client-meeting-dashboard-builder-input-validation.json records a ready decision, verify artifacts/user-smoke/result.json records a successful smoke, verify artifacts/user-smoke/page-source.html visibly contains the synthetic-data disclosure and the fresh upstream digest sha256:57ed296635806a15deb7286879bae8b009fc551a86fce4b1f3cb564bcf775390, verify frontend/package.json exposes the package:meeting-dashboard seam with the staging-then-rename publisher in frontend/package-tools/materializeMeetingDashboardPackage.ts, and report readiness truthfully in your final message. Never construct an rfpf envelope in TypeScript; canonical wrapping is platform-owned. If the smoke evidence is missing, failed, or lacks the disclosure or digest, report blocked rather than an invented success.",
      "inputs": [
        "frontend/package.json",
        "artifacts/current/client-meeting-dashboard-builder-input-validation.json",
        "frontend/package-tools/materializeMeetingDashboardPackage.ts",
        "frontend/src/features/export/meetingDashboardPackage.ts",
        "artifacts/user-smoke/result.json",
        "artifacts/user-smoke/page-source.html"
