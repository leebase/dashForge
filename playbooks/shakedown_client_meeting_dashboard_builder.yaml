    {
      "step_id": "approve_meeting_dashboard_package",
      "type": "human_approval",
      "name": "Approve the client meeting dashboard package",
      "mission": "Human gate: inspect the standalone dashboard, synthetic/quality disclosures, browser-smoke evidence, six domain package parts built from the fresh DataForge receipt (source run 31ad67eea2f1, digest sha256:57ed296635806a15deb7286879bae8b009fc551a86fce4b1f3cb564bcf775390), and independent review verdict. Approval is explicit and does not launch, promote, schedule, wrap, or send the artifact. Approve with `agent-orch approve <run_dir> approve_meeting_dashboard_package` and resume with `agent-orch resume-run <run_dir>` only if the package is suitable for the client meeting.",
      "inputs": [
        "artifacts/current/client-meeting-dashboard-builder/",
        "artifacts/user-smoke/result.json",
        "code-reviews/review-client-meeting-dashboard-builder.md",
        "code-reviews/review-client-meeting-dashboard-builder.verdict.json"
      ],
      "depends_on": [
        "independent_package_review"
      ]
    }
  ]
