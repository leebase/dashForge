    {
      "step_id": "render_and_smoke_standalone",
      "name": "Render and smoke the controlled standalone dashboard",
      "worker": "browser_smoke_runner",
      "mission": "Serve the already-built frontend with tests/browser_smoke_manifest.json, open the canonical standalone route, wait for controlled synthetic quality readiness, exercise the same-day executive follow-up action, and capture the rendered page source and browser result. The evidence must visibly contain the synthetic-data disclosure, controlled quality state, the fresh upstream artifact digest sha256:57ed296635806a15deb7286879bae8b009fc551a86fce4b1f3cb564bcf775390, material source citations, and a successful export interaction. Do not repair product code from this evaluator step.",
