            ],
            "timeout_seconds": 900
          }
        ]
      },
      "on_fail": {
        "retry_message": "The platform validator materializes the package exactly once through the export seam; if it failed, remove nothing outside artifacts/current/client-meeting-dashboard-builder/, leave that directory absent or empty, and report the deterministic blocker. Halt on failed smoke, blocked generation result, digest mismatch, missing claim, or missing package part; never hand-author a successful payload.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "independent_package_review",
      "role": "independent_reviewer",
      "name": "Independently review the governed dashboard package",
      "mission": "Act as an independent read-only reviewer. Review scope (authorized clarification for this shakedown): the client-meeting-dashboard-builder PACKAGE DATAFLOW — frontend/, consumption of the digest-pinned receipt under .agent-orch-inputs/dataforge/, and the package export seam — plus every materialized package part under artifacts/current/client-meeting-dashboard-builder/. The documented legacy Python compatibility wrapper (src/dashForge/_dataforge_compat.py, src/dashForge/generate.py, src/dashForge/main.py and the tests that exercise it) is out of scope FOR THIS PACKAGE REVIEW; it is already recorded as reviewer finding CMD-R1 from run e40c272b0e04 with a follow-up item in the DashForge backlog, and importing DataForge source through that wrapper must not be re-reported as a package finding. You remain free to fail the verdict on anything else, including any NEW boundary bleed inside the scoped surface (e.g. frontend code importing DataForge source or fixtures, browser provider credentials, or direct model calls). Verify that the scoped dataflow does not import DataForge source, no browser provider credential/direct model call exists in it, the input digest sha256:57ed296635806a15deb7286879bae8b009fc551a86fce4b1f3cb564bcf775390 is identical across spec/bindings/claims/generation result, visible synthetic disclosure is present in dashboard.html, and no uncited material surface can be ready. Run `python3 -m pytest tests/ -q` and `npm --prefix frontend test -- src/core/data/SyntheticDataArtifactAdapter.test.ts src/features/export/meetingDashboardPackage.test.ts`, then record their actual exit codes in the canonical verdict JSON so checks_run_match can re-execute them; pytest exercising the out-of-scope compat wrapper does not itself constitute a package finding. Write code-reviews/review-client-meeting-dashboard-builder.md with Checks Run and Lens Notes sections, each carrying at least 40 non-whitespace characters of substantive content under its heading, and the canonical verdict JSON beside it.",
      "inputs": [
        "AGENTS.md",
        "employee-specs/client-meeting-dashboard-builder.json",
        "employee-specs/client-meeting-dashboard-builder.shakedown-receipt.json",
        ".agent-orch-inputs/dataforge/work-package.json",
        "artifacts/current/client-meeting-dashboard-builder/",
        "artifacts/user-smoke/result.json",
        "frontend/src/"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "depends_on": [
        "materialize_meeting_dashboard_package"
      ],
      "outputs": {
        "required": [
          {
            "path": "code-reviews/review-client-meeting-dashboard-builder.md",
            "type": "markdown"
          },
          {
            "path": "code-reviews/review-client-meeting-dashboard-builder.verdict.json",
            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "json_parse",
            "path": "artifacts/current/client-meeting-dashboard-builder/dashboard.spec.json"
          },
          {
            "type": "json_parse",
            "path": "artifacts/current/client-meeting-dashboard-builder/binding-map.json"
          },
          {
            "type": "json_parse",
            "path": "artifacts/current/client-meeting-dashboard-builder/claim-ledger.json"
          },
          {
            "type": "file_exists",
            "path": "artifacts/current/client-meeting-dashboard-builder/dashboard.html"
          },
          {
            "type": "json_parse",
            "path": "artifacts/current/client-meeting-dashboard-builder/browser-smoke-result.json"
          },
          {
            "type": "json_parse",
            "path": "artifacts/current/client-meeting-dashboard-builder/dashboard-generation-result.json"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-client-meeting-dashboard-builder.md",
            "headings": [
              "Checks Run",
              "Lens Notes"
            ],
            "min_chars_under_heading": 40
          },
          {
            "type": "json_schema",
            "path": "code-reviews/review-client-meeting-dashboard-builder.verdict.json",
            "schema_path": "builtin:review_verdict/v1"
          },
          {
            "type": "review_verdict_clean",
            "path": "code-reviews/review-client-meeting-dashboard-builder.verdict.json",
            "severity_threshold": "Medium"
          }
        ],
        "system": [
          {
            "type": "checks_run_match",
            "path": "code-reviews/review-client-meeting-dashboard-builder.verdict.json",
            "timeout_seconds": 900
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair only the review evidence if it is incomplete. A real product or package finding must remain a failing verdict and halt for a separately authorized repair; the reviewer must not fix its own finding.",
        "after_retries_exhausted": "halt"
      }
