            "sha256": "4cc9a882ac5a57ecc62b5a670c9315dfda4b53b37472c19be3b8b4c93e76506d"
          },
          {
            "type": "file_hash_matches",
            "path": "frontend/src/fixtures/dataforge/idle-warehouse-waste-snapshot.json",
